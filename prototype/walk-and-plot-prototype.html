<title>Walk &amp; Plot Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
/>
<style>
  /* ============ page chrome tokens (theme aware) ============ */
  :root {
    color-scheme: light;
    --pg-bg: #edede8;
    --pg-surface: #ffffff;
    --pg-ink: #17181c;
    --pg-ink2: #575c66;
    --pg-line: #deddd5;
    --pg-accent: #4f46e5;
    --pg-shadow: 0 24px 60px -18px rgba(23, 24, 28, 0.3);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --pg-bg: #0f1013;
      --pg-surface: #181a1f;
      --pg-ink: #ecedf1;
      --pg-ink2: #9aa0ac;
      --pg-line: #262932;
      --pg-accent: #8b93f8;
      --pg-shadow: 0 24px 60px -18px rgba(0, 0, 0, 0.7);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --pg-bg: #0f1013;
    --pg-surface: #181a1f;
    --pg-ink: #ecedf1;
    --pg-ink2: #9aa0ac;
    --pg-line: #262932;
    --pg-accent: #8b93f8;
    --pg-shadow: 0 24px 60px -18px rgba(0, 0, 0, 0.7);
  }

  /* ============ app tokens (fixed: the product is clean & light) ============ */
  :root {
    --a-bg: #f6f6f3;
    --a-card: #ffffff;
    --a-ink: #191b23;
    --a-ink2: #5d616d;
    --a-ink3: #9a9eaa;
    --a-line: #e7e7ec;
    --a-accent: #4f46e5;
    --a-accent-deep: #3e36c7;
    --a-accent-soft: #edecfc;
    --a-good: #15803d;
    --a-good-bg: #dcf3e3;
    --a-warn: #b45309;
    --a-warn-bg: #fcf0d9;
    --a-bad: #b91c1c;
    --a-bad-bg: #fce5e5;
    --hue-teal-fg: #0f766e;
    --hue-teal-bg: #d8f1ed;
    --hue-indigo-fg: #4338ca;
    --hue-indigo-bg: #e5e4fb;
    --hue-rose-fg: #be123c;
    --hue-rose-bg: #fbe2e8;
    --hue-violet-fg: #6d28d9;
    --hue-violet-bg: #ece4fb;
    --hue-orange-fg: #c2410c;
    --hue-orange-bg: #fce9dc;
    --hue-green-fg: #15803d;
    --hue-green-bg: #dcf3e3;
    --hue-cyan-fg: #0e7490;
    --hue-cyan-bg: #d9f0f6;
    --hue-amber-fg: #b45309;
    --hue-amber-bg: #fcf0d9;
    --hue-slate-fg: #475569;
    --hue-slate-bg: #e8ebf0;
    --hue-sky-fg: #0369a1;
    --hue-sky-bg: #dbedf8;
  }

  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--pg-bg);
    color: var(--pg-ink);
    font-family:
      "Instrument Sans",
      system-ui,
      -apple-system,
      "Segoe UI",
      sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button {
    font-family: inherit;
  }
  :focus-visible {
    outline: 2px solid var(--pg-accent);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: none !important;
    }
  }

  .wrap {
    max-width: 1220px;
    margin: 0 auto;
    padding: 22px 20px 44px;
  }

  /* ---------- masthead ---------- */
  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px 20px;
    margin: 2px 0 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brandmark {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--a-accent);
    display: grid;
    place-items: center;
    color: #fff;
    flex: none;
    box-shadow: 0 6px 16px -6px rgba(79, 70, 229, 0.55);
  }
  h1 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 23px;
    margin: 0;
    letter-spacing: -0.01em;
    font-weight: 700;
  }
  .mast-sub {
    color: var(--pg-ink2);
    font-size: 13.5px;
    margin-top: 1px;
  }
  .mast-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .mmeta {
    font-size: 12px;
    font-weight: 600;
    color: var(--pg-ink2);
    border: 1px solid var(--pg-line);
    background: var(--pg-surface);
    border-radius: 99px;
    padding: 4px 11px;
  }

  /* ---------- jump chips ---------- */
  .chips {
    position: sticky;
    top: 0;
    z-index: 40;
    background: linear-gradient(var(--pg-bg) 82%, transparent);
    padding: 8px 0 10px;
    margin: 0 -2px;
  }
  .chips-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 3px 2px 6px;
    scrollbar-width: none;
  }
  .chips-scroll::-webkit-scrollbar {
    display: none;
  }
  .jchip {
    flex: none;
    border: 1px solid var(--pg-line);
    background: var(--pg-surface);
    color: var(--pg-ink2);
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 99px;
    padding: 6px 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .jchip:hover {
    color: var(--pg-ink);
    border-color: var(--pg-ink2);
  }
  .jchip.on {
    background: var(--pg-ink);
    border-color: var(--pg-ink);
    color: var(--pg-bg);
  }

  /* ---------- layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 332px;
    gap: 22px;
    align-items: start;
  }
  @media (max-width: 1040px) {
    .layout {
      grid-template-columns: 1fr;
    }
  }

  /* ---------- build notes card ---------- */
  .notes {
    position: sticky;
    top: 64px;
    background: var(--pg-surface);
    border: 1px solid var(--pg-line);
    border-radius: 18px;
    padding: 18px 18px 14px;
  }
  .notes .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--pg-accent);
    margin-bottom: 6px;
  }
  .notes h3 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 17px;
    margin: 0 0 10px;
    font-weight: 700;
  }
  .notes ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .notes li {
    position: relative;
    padding-left: 16px;
    color: var(--pg-ink2);
    font-size: 13px;
    line-height: 1.5;
  }
  .notes li::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 8px;
    width: 6px;
    height: 6px;
    border-radius: 2px;
    background: var(--pg-accent);
    opacity: 0.75;
  }
  .notes li b {
    color: var(--pg-ink);
    font-weight: 600;
  }
  .foot {
    margin-top: 26px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px;
    color: var(--pg-ink2);
    font-size: 12.5px;
  }
  .linkbtn {
    background: none;
    border: none;
    padding: 0;
    color: var(--pg-accent);
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* ---------- phone ---------- */
  .stage {
    min-width: 0;
  }
  .phone {
    width: min(394px, 100%);
    margin: 0 auto;
    background: #0c0d12;
    border-radius: 54px;
    padding: 11px;
    box-shadow: var(--pg-shadow);
  }
  .pscreen {
    position: relative;
    background: var(--a-bg);
    border-radius: 44px;
    overflow: hidden;
    height: clamp(620px, 82vh, 806px);
    display: flex;
    flex-direction: column;
    color: var(--a-ink);
  }
  .island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 112px;
    height: 27px;
    background: #0c0d12;
    border-radius: 20px;
    z-index: 70;
    pointer-events: none;
  }
  .homebar {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 5px;
    border-radius: 3px;
    background: rgba(25, 27, 35, 0.85);
    z-index: 70;
    pointer-events: none;
  }
  .scr {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .scr-body {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    padding: 6px 18px 16px;
    scrollbar-width: none;
  }
  .scr-body::-webkit-scrollbar {
    display: none;
  }
  .scr-foot {
    padding: 10px 18px calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: linear-gradient(transparent, var(--a-bg) 30%);
  }

  .dotgrid {
    background-image: radial-gradient(rgba(25, 27, 35, 0.1) 1.1px, transparent 1.1px);
    background-size: 18px 18px;
  }

  /* ---------- status bar ---------- */
  .sbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 28px 4px;
    font-size: 13.5px;
    font-weight: 600;
    flex: none;
  }
  .sbar .sicons {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* ---------- app top bar ---------- */
  .appbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px 10px;
    flex: none;
  }
  .appbar .grow {
    flex: 1;
    min-width: 0;
  }
  .appbar h2 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 19px;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .appbar .sub {
    font-size: 12px;
    color: var(--a-ink3);
    margin-top: -1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- primitives ---------- */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    min-height: 48px;
    border-radius: 14px;
    border: 1px solid var(--a-line);
    background: var(--a-card);
    font:
      600 15px "Instrument Sans",
      sans-serif;
    color: var(--a-ink);
    cursor: pointer;
    padding: 0 16px;
    transition: transform 0.1s;
  }
  .btn:active {
    transform: scale(0.98);
  }
  .btn.primary {
    background: var(--a-accent);
    border-color: var(--a-accent);
    color: #fff;
  }
  .btn.primary:disabled {
    opacity: 0.4;
    cursor: default;
    transform: none;
  }
  .btn.danger {
    background: var(--a-bad-bg);
    border-color: transparent;
    color: var(--a-bad);
  }
  .btn.small {
    min-height: 38px;
    width: auto;
    padding: 0 14px;
    border-radius: 11px;
    font-size: 13.5px;
  }
  .iconbtn {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    border: 1px solid var(--a-line);
    background: var(--a-card);
    color: var(--a-ink);
    cursor: pointer;
    flex: none;
    padding: 0;
  }
  .iconbtn.circle {
    border-radius: 50%;
    box-shadow: 0 3px 12px rgba(23, 24, 28, 0.14);
  }
  .iconbtn.danger {
    color: var(--a-bad);
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--a-accent-soft);
    color: var(--a-accent-deep);
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 14px;
    flex: none;
  }
  .sect {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--a-ink3);
    margin: 18px 0 8px;
  }
  .tiny {
    font-size: 12px;
    color: var(--a-ink3);
    text-align: center;
    margin: 2px 0 0;
    line-height: 1.5;
  }

  .tchip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .h-teal {
    background: var(--hue-teal-bg);
    color: var(--hue-teal-fg);
  }
  .h-indigo {
    background: var(--hue-indigo-bg);
    color: var(--hue-indigo-fg);
  }
  .h-rose {
    background: var(--hue-rose-bg);
    color: var(--hue-rose-fg);
  }
  .h-violet {
    background: var(--hue-violet-bg);
    color: var(--hue-violet-fg);
  }
  .h-orange {
    background: var(--hue-orange-bg);
    color: var(--hue-orange-fg);
  }
  .h-green {
    background: var(--hue-green-bg);
    color: var(--hue-green-fg);
  }
  .h-cyan {
    background: var(--hue-cyan-bg);
    color: var(--hue-cyan-fg);
  }
  .h-amber {
    background: var(--hue-amber-bg);
    color: var(--hue-amber-fg);
  }
  .h-slate {
    background: var(--hue-slate-bg);
    color: var(--hue-slate-fg);
  }
  .h-sky {
    background: var(--hue-sky-bg);
    color: var(--hue-sky-fg);
  }

  /* ---------- v2 components ---------- */
  .savedot {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    color: var(--a-good);
    flex: none;
  }
  .savedot i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--a-good);
    display: inline-block;
  }
  .untchip {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--hue-slate-bg);
    color: var(--hue-slate-fg);
    flex: none;
  }
  .toolrow {
    display: flex;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .tool {
    flex: 1;
    min-height: 52px;
    border-radius: 15px;
    border: 1.5px solid var(--a-line);
    background: var(--a-card);
    font:
      600 14px "Instrument Sans",
      sans-serif;
    color: var(--a-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    cursor: pointer;
    padding: 0 8px;
  }
  .tool.active {
    border-color: var(--a-accent);
    background: var(--a-accent-soft);
    color: var(--a-accent-deep);
  }
  .raggle {
    min-height: 52px;
    width: 56px;
    border-radius: 15px;
    border: 1.5px solid var(--a-line);
    background: var(--a-card);
    font:
      700 12.5px "JetBrains Mono",
      monospace;
    color: var(--a-ink2);
    cursor: pointer;
    flex: none;
  }
  .raggle.on {
    border-color: var(--a-accent);
    background: var(--a-accent-soft);
    color: var(--a-accent-deep);
  }
  .banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--a-warn-bg);
    border-radius: 14px;
    padding: 11px 12px;
    margin: 10px 0 2px;
  }
  .banner .bt {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--a-warn);
    line-height: 1.4;
  }
  .banner .grow {
    flex: 1;
    min-width: 0;
  }
  #toast .tact {
    background: none;
    border: none;
    color: #a5b4fc;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    margin-left: 10px;
    padding: 0;
    font-family: inherit;
  }
  .klist {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .krow {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1.5px solid var(--a-line);
    border-radius: 13px;
    padding: 11px 12px;
    cursor: pointer;
    background: var(--a-card);
    font:
      600 14px "Instrument Sans",
      sans-serif;
    color: var(--a-ink);
    text-align: left;
    width: 100%;
  }
  .krow.on {
    border-color: var(--a-accent);
    background: var(--a-accent-soft);
  }
  .krow .km {
    margin-left: auto;
    color: var(--a-ink3);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .stepper {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .stepper .cnt {
    font:
      700 15px "JetBrains Mono",
      monospace;
    min-width: 26px;
    text-align: center;
  }
  .txt3d {
    font:
      800 11px "Instrument Sans",
      sans-serif;
    letter-spacing: 0.02em;
  }
  #v3d {
    touch-action: none;
    cursor: grab;
  }
  .schip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 99px;
    font-size: 11.5px;
    font-weight: 700;
  }
  .schip.done {
    background: var(--a-good-bg);
    color: var(--a-good);
  }
  .schip.live {
    background: var(--a-accent-soft);
    color: var(--a-accent-deep);
  }
  .schip.draft {
    background: var(--hue-slate-bg);
    color: var(--hue-slate-fg);
  }

  .field {
    width: 100%;
    min-height: 46px;
    border: 1.5px solid var(--a-line);
    border-radius: 12px;
    padding: 10px 12px;
    font:
      500 15px "Instrument Sans",
      sans-serif;
    background: var(--a-card);
    color: var(--a-ink);
  }
  .field:focus {
    border-color: var(--a-accent);
    outline: none;
    box-shadow: 0 0 0 3px var(--a-accent-soft);
  }
  .field::placeholder {
    color: var(--a-ink3);
  }
  .flabel {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--a-ink2);
    margin: 12px 0 6px;
    display: block;
  }

  .choice {
    padding: 9px 13px;
    border-radius: 11px;
    border: 1.5px solid var(--a-line);
    background: var(--a-card);
    font:
      600 13.5px "Instrument Sans",
      sans-serif;
    color: var(--a-ink);
    cursor: pointer;
  }
  .choice.on {
    border-color: var(--a-accent);
    background: var(--a-accent-soft);
    color: var(--a-accent-deep);
  }
  .chiprow {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .opt {
    display: flex;
    gap: 12px;
    align-items: center;
    width: 100%;
    text-align: left;
    border: 1.5px solid var(--a-line);
    border-radius: 14px;
    padding: 12px 13px;
    cursor: pointer;
    background: var(--a-card);
  }
  .opt .ot {
    font-weight: 700;
    font-size: 14.5px;
  }
  .opt .od {
    font-size: 12.5px;
    color: var(--a-ink2);
    margin-top: 1px;
  }
  .opt.on {
    border-color: var(--a-accent);
    background: var(--a-accent-soft);
  }
  .opt .oico {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    flex: none;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 13px;
    border: 1px solid var(--a-line);
    border-radius: 16px;
    background: var(--a-card);
    width: 100%;
    text-align: left;
    cursor: pointer;
    color: var(--a-ink);
  }
  .row + .row {
    margin-top: 8px;
  }
  .row .rt {
    font-weight: 700;
    font-size: 14.5px;
  }
  .row .rm {
    font-size: 12.5px;
    color: var(--a-ink3);
    margin-top: 1px;
  }
  .row .thumb {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    border: 1px solid var(--a-line);
    flex: none;
    overflow: hidden;
    background: #fdfdfb;
  }
  .row .grow {
    flex: 1;
    min-width: 0;
  }
  .row .chev {
    color: var(--a-ink3);
    flex: none;
  }

  /* ---------- sheets ---------- */

  function junctionPoints(floor) {

    // or 3+ path endpoints sharing one point. Never drawn directly.
    const paths = floor.features.filter((f) => f.geom === "line");
    const out = [];
    paths.forEach((a) => {
      [a.vs[0], a.vs[a.vs.length - 1]].forEach((e) => {
        let onSeg = false,
          coincident = 0;
        paths.forEach((b) => {
          if (b === a) return;
          for (let i = 0; i < b.vs.length; i++) {
            if (dist(b.vs[i], e) < 0.06) {
              coincident++;
              break;
            }
          }
          if (coincident) return;
          for (let i = 0; i < b.vs.length - 1; i++) {
            const a2 = b.vs[i],
              b2 = b.vs[i + 1];
            const dx = b2.x - a2.x,
              dy = b2.y - a2.y,
              l2 = dx * dx + dy * dy || 1;
            const t = ((e.x - a2.x) * dx + (e.y - a2.y) * dy) / l2;
            const d = ptSegDist(e, a2, b2);
            if (d < 0.06 && t > 0.02 && t < 0.98) {
              onSeg = true;
              break;
            }

  function closestOnRing(vs, q) {

      const dx = c.x - a.x,
        dy = c.y - a.y,
        l2 = dx * dx + dy * dy || 1;
      let t = ((q.x - a.x) * dx + (q.y - a.y) * dy) / l2;
      t = clamp(t, 0, 1);
      const p = { x: a.x + t * dx, y: a.y + t * dy };
      const d = dist(q, p);

        b = p;

      const c = f.geom === "point" ? f.p : centroid(f.vs);
      let best = null,

      paths.forEach((p) => {

            l2 = dx * dx + dy * dy || 1;

  function snapPose(p) {
    // snap priority per PRD 13: endpoints > segments > grid

            b = f.vs[i + 1];

  function icoSpan(ic, bg, fg) {

  function shHead(ico, title, sub, closeA) {

      '<div class="grab"></div><div class="shead">' +

      title +

      '<button class="iconbtn" data-a="' +
      (closeA || "sheet-close") +

      icon("close", 16) +
      "</button></div>"

  function chipsRow(label, fld, opts, cur) {
    return (
      '<span class="flabel">' +
      label +
      '</span><div class="chiprow">' +
      opts
        .map(
          (o) =>
            '<button class="choice' +
            (cur === o[0] ? " on" : "") +
            '" data-a="dchip" data-d="' +
            fld +
            ":" +
            o[0] +
            '">' +
            o[1] +
            "</button>",
        )
        .join("") +
      "</div>"

  function sheetHTML() {
    const sh = S.sheet;
    if (!sh) return "";
    const dismiss = [
      "palette",
      "new",
      "floor",
      "menu",
      "rename",
      "export",
      "finish",
      "calibrate",
    ].includes(sh.kind);
    const backA = dismiss ? "sheet-close" : sh.kind === "discard" ? "discard-keep" : "noop";
    return (
      '<div class="sheet-wrap"><button class="backdrop" data-a="' +
      backA +
      '" aria-label="Close" tabindex="-1"></button><div class="sheet">' +
      sheetBody(sh) +
      "</div></div>"
    );
  }
  function sheetBody(sh) {
    if (sh.kind === "palette") {
      return (
        shHead(
          icoSpan("hand", "var(--a-accent-soft)", "var(--a-accent)"),
          "What is it?",
          "Pick a type, then tap the map",
        ) +
        '<div class="tilegrid">' +
        PALETTE.map(
          (t) =>
            '<button class="tile" data-a="pick-type" data-t="' +
            t +

            tileIco(t, 40) +
            "<span>" +
            esc(TYPES[t].label) +
            "</span></button>",
        ).join("") +
        "</div>"
      );
    }
    if (sh.kind === "detail" || sh.kind === "detail-path") return sheetDetail();
    if (sh.kind === "calibrate") return sheetCalibrate();
    if (sh.kind === "export") return sheetExport();
    if (sh.kind === "finish") {
      const c = fCounts(curFloor());
      return (
        shHead(
          icoSpan("flag", "var(--a-accent-soft)", "var(--a-accent)"),
          "Finish " + esc(curFloor().name) + "?",

      );

        shHead(

  /* ================= toast / history / save ================= */
  let toastTimer = null;

  function hideToast() {

  function savedPulse() {
    const d = document.getElementById("savedot");
    if (!d) return;

  function pushHist() {
    const floor = curFloor();
    if (!floor) return;
    const h = S.hist;
    h.stack = h.stack.slice(0, h.idx + 1);
    h.stack.push({
      fid: floor.id,
      data: JSON.stringify({ features: floor.features, scale: floor.scale }),
    });
    if (h.stack.length > 100) h.stack.shift();
    h.idx = h.stack.length - 1;
  }
  function histGo(d) {
    const h = S.hist,
      ni = h.idx + d;
    if (ni < 0 || ni >= h.stack.length) return;
    h.idx = ni;
    const snap = h.stack[h.idx];
    const floor = curFloor();
    if (floor && floor.id === snap.fid) {
      const st = JSON.parse(snap.data);
      floor.features = st.features;
      floor.scale = st.scale;
      if (S.sel && !floor.features.find((f) => f.id === S.sel)) S.sel = null;
    }
    render();
  }

  /* ================= capture logic ================= */
  function draftOf(f) {
    return {
      tag: f.subtype,
      name: f.name || "",
      number: (f.props && f.props.shopNumber) || "",
      gender: (f.props && f.props.gender) || "",
      kind: (f.props && f.props.kind) || "",
      direction: (f.props && f.props.direction) || "",
      accessible: (f.props && f.props.accessible) || "",
      access: f.access || "public",
      conf: f.confidence || "high",
      toFloorId: (f.props && f.props.toFloorId) || "",
      newFloor: "",
      connect: (f.props && f.props.connect) || null,
      notes: f.notes || "",
      width: (f.props && f.props.width) || "",
    };
  }
  function cleanVs(vs) {
    return vs.map((v) => ({ x: Math.round(v.x * 100) / 100, y: Math.round(v.y * 100) / 100 }));
  }
  function applyDoorLink(f) {
    const floor = curFloor();
    const c = f.geom === "point" ? f.p : centroid(f.vs);
    let best = null,
      bd = 2.5;
    floor.features.forEach((p) => {
      if (p.geom !== "line") return;
      for (let i = 0; i < p.vs.length - 1; i++) {
        const a = p.vs[i],
          b = p.vs[i + 1];
        const dx = b.x - a.x,
          dy = b.y - a.y,
          l2 = dx * dx + dy * dy || 1;
        let t = ((c.x - a.x) * dx + (c.y - a.y) * dy) / l2;
        t = clamp(t, 0, 1);
        const q = { x: a.x + t * dx, y: a.y + t * dy };
        const d = dist(f.geom === "point" ? f.p : closestOnRing(f.vs, q), q);
        if (d < bd) {
          bd = d;
          best = { pid: p.id, d: d };
        }
      }
    });
    if (best && best.d > 0.15 && best.d < 2.5) f.props.connect = best.pid;
  }
  function plotTap(w) {
    const fl = S.flow;
    const p = effPoint(w);
    const valid = fl.tool === "path" ? fl.vs.length >= 2 : fl.vs.length >= 3;
    if (valid && dist(p, fl.vs[0]) * V.k < 14) {
      finishGesture();
      return;
    }
    if (fl.vs.length && dist(p, fl.vs[fl.vs.length - 1]) * V.k < 6) return;
    fl.vs.push({ x: p.x, y: p.y });
    if (p.kind) {
      S.snapFlash = { x: p.x, y: p.y, kind: p.kind };
      clearTimeout(S._sfT);
      S._sfT = setTimeout(() => {
        S.snapFlash = null;
        paintMap();
      }, 650);
      if (p.kind === "segment") toast("Snapped onto a path - they will connect");
    }
    paintMap();
  }
  function finishGesture() {
    const fl = S.flow,
      floor = curFloor();
    const n = fl.vs.length;
    if (fl.tool === "path" && n < 2) return;
    if (fl.tool === "place" && n < 3) return;
    if (fl.tool === "path") {
      const f = F(uid(), "corridor", null, { vs: cleanVs(fl.vs) });
      floor.features.push(f);
      S.flow = { tool: "path", subtype: "corridor", stage: "plot", vs: [] };
      pushHist();
      savedPulse();
      S.edd = draftOf(f);
      S.sheet = { kind: "detail-path", fid: f.id };
      toast("Path saved");
    } else {
      const f = F(uid(), fl.subtype, null, { vs: cleanVs(fl.vs) });
      applyDoorLink(f);
      floor.features.push(f);
      pushHist();
      savedPulse();
      S.flow = null;
      S.edd = draftOf(f);
      S.sheet = { kind: "detail", fid: f.id, fresh: true };
      toast(TYPES[fl.subtype].label + " saved");
    }
    render();
  }
  function placePoint(w) {
    const fl = S.flow,
      floor = curFloor();
    const p = effPoint(w);
    const f = F(uid(), fl.subtype, null, {
      p: { x: Math.round(p.x * 100) / 100, y: Math.round(p.y * 100) / 100 },
    });
    applyDoorLink(f);
    floor.features.push(f);
    pushHist();
    savedPulse();
    S.flow = null;
    S.edd = draftOf(f);
    S.sheet = { kind: "detail", fid: f.id, fresh: true };
    toast(TYPES[fl.subtype].label + " saved" + (f.props.connect ? " - door linked" : ""));
    render();
  }
  function insertCorner(mh) {
    const floor = curFloor();
    const f = floor.features.find((x) => x.id === mh.fid);
    if (!f || !f.vs) return;
    const n = f.vs.length;
    const a = f.vs[mh.i],
      b = f.vs[(mh.i + 1) % n];
    f.vs.splice(mh.i + 1, 0, { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    pushHist();
    savedPulse();
    paintMap();
  }
  function deleteSel() {
    const floor = curFloor();
    const i = floor.features.findIndex((f) => f.id === S.sel);
    if (i < 0) return;
    const f = floor.features.splice(i, 1)[0];
    S.sel = null;
    pushHist();
    savedPulse();
    render();
    toast("Deleted " + (f.name || TYPES[f.subtype].label), "Undo", () => {
      if (curFloor() !== floor) return;
      floor.features.splice(Math.min(i, floor.features.length), 0, f);
      pushHist();
      savedPulse();
      render();
    });
  }
  function hitFeature(mx, my) {
    const floor = curFloor();
    const tol = 10 / V.k;
    const arr = floor.features;
    for (let i = arr.length - 1; i >= 0; i--) {
      const f = arr[i];
      if (f.geom === "point" && dist(f.p, { x: mx, y: my }) < 14 / V.k) return f;
    }
    for (let i = arr.length - 1; i >= 0; i--) {
      const f = arr[i];
      if (f.geom === "poly" && PIP(mx, my, f.vs)) return f;
      if (f.geom === "line") {
        for (let j = 0; j < f.vs.length - 1; j++) {
          if (ptSegDist({ x: mx, y: my }, f.vs[j], f.vs[j + 1]) < tol) return f;
        }
      }
    }
    return null;
  }

  /* ================= canvas binding ================= */
  function bindCanvas() {
    const svg = document.getElementById("mapsvg");
    if (!svg) return;
    let ptr = null;
    const rectOf = () => svg.getBoundingClientRect();
    const worldOf = (e) => {
      const r = rectOf();
      return { x: (e.clientX - r.left - V.tx) / V.k, y: (e.clientY - r.top - V.ty) / V.k };
    };
    svg.onpointerdown = (e) => {
      svg.setPointerCapture(e.pointerId);
      ptr = {
        x: e.clientX,
        y: e.clientY,
        moved: false,
        vh:
          e.target.dataset && e.target.dataset.vh !== undefined
            ? { fid: e.target.dataset.fid, i: +e.target.dataset.vh }
            : null,
        mh:
          e.target.dataset && e.target.dataset.mh !== undefined
            ? { fid: e.target.dataset.fid, i: +e.target.dataset.mh }
            : null,
      };
    };
    svg.onpointermove = (e) => {
      const w = worldOf(e);
      if (ptr && ptr.moved) {
        if (ptr.vh) {
          const f = curFloor().features.find((x) => x.id === ptr.vh.fid);
          if (f && f.vs) {
            const p = { x: Math.round(w.x * 10) / 10, y: Math.round(w.y * 10) / 10 };
            if (f.geom === "point") f.p = p;
            else f.vs[ptr.vh.i] = p;
          }
          ptr.vhMoved = true;
        } else {
          V.tx += e.movementX;
          V.ty += e.movementY;
          S.pointerM = null;
          S.snapCand = null;
        }
        paintMap();
        return;
      }
      if (S.flow && S.flow.stage === "plot") {
        S.pointerM = w;
        S.snapCand = snapPose(effPoint(w));
        paintMap();
      }
    };
    svg.onpointerup = (e) => {
      const w = worldOf(e);
      const tap = ptr && !ptr.moved;
      const vh = ptr && ptr.vh,
        vhMoved = ptr && ptr.vhMoved,
        mh = ptr && ptr.mh;
      ptr = null;
      if (vh && vhMoved) {
        pushHist();
        savedPulse();
        return;
      }
      if (!tap) return;
      S.snapCand = null;
      if (mh) {
        insertCorner(mh);
        return;
      }
      if (S.flow && S.flow.stage === "plot") {
        plotTap(w);
        return;
      }
      if (S.flow && S.flow.stage === "place") {
        placePoint(w);
        return;
      }
      const f = hitFeature(w.x, w.y);
      S.sel = f ? f.id : null;
      render();
    };
    svg.onpointercancel = () => {
      ptr = null;
    };
    svg.onpointerleave = () => {
      S.pointerM = null;
      S.snapCand = null;
      if (S.flow) paintMap();
    };
    svg.onwheel = (e) => {
      e.preventDefault();
      const r = rectOf();
      zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.9);
    };
    svg.ondblclick = (e) => {
      const r = rectOf();
      zoomAt(e.clientX - r.left, e.clientY - r.top, 1.5);
    };
  }

  /* ================= 3D view (hand-rolled orthographic SVG) ================= */
  const V3DEF = { yaw: -0.65, pitch: 0.52, zoom: 1, focus: "all" };
  function stopRot() {
    if (S._rot) {
      clearInterval(S._rot);
      S._rot = null;
    }
  }
  function startRot() {
    stopRot();
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    S._rot = setInterval(() => {
      S.v3.yaw += 0.004;
      render3D();
    }, 40);
  }
  function render3D() {
    const host = document.getElementById("v3d");
    if (!host) {
      stopRot();
      return;
    }
    const p = curProj();
    if (!p) {
      host.innerHTML = "";
      return;
    }
    const floors = p.floors.slice().sort((a, b) => a.order - b.order);
    if (!floors.length) {
      host.innerHTML = '<p class="tiny" style="padding-top:40px">No floors yet</p>';
      return;
    }
    const W = host.clientWidth || 390,
      H = host.clientHeight || 520;
    const GAP = 3.2,
      SLAB = 0.18,
      WALL = 1.35,
      PATHW = 0.55;
    const v = S.v3;
    const cy = Math.cos(v.yaw),
      syy = Math.sin(v.yaw),
      cp = Math.cos(v.pitch),
      sp = Math.sin(v.pitch);
    let pj = { k: 1, cx: 0, cy: 0 };
    function proj(q) {
      const xr = q.x * cy - q.y * syy,
        yr = q.x * syy + q.y * cy;
      return [xr * pj.k + pj.cx, (yr * cp - q.z * sp) * pj.k + pj.cy, yr * sp - q.z * cp];
    }
    const active = v.focus === "all" ? S.fid : v.focus;
    const defs = [];
    const bnd = { x0: 1e9, x1: -1e9, y0: 1e9, y1: -1e9, z0: 1e9, z1: -1e9 };
    function addDef(pts, fill, stroke, sw, op) {
      defs.push({ pts: pts, fill: fill, stroke: stroke, sw: sw, op: op });
      pts.forEach((q) => {
        bnd.x0 = Math.min(bnd.x0, q.x);
        bnd.x1 = Math.max(bnd.x1, q.x);
        bnd.y0 = Math.min(bnd.y0, q.y);
        bnd.y1 = Math.max(bnd.y1, q.y);
        bnd.z0 = Math.min(bnd.z0, q.z);
        bnd.z1 = Math.max(bnd.z1, q.z);
      });
    }
    floors.forEach((fl) => {
      const z0 = (fl.order - floors[0].order) * GAP,
        zt = z0 + SLAB;
      const g = fl.id === active ? 1 : 0.18;
      let x0 = 1e9,
        x1 = -1e9,
        y0 = 1e9,
        y1 = -1e9,
        has = false;
      fl.features.forEach((f) => {
        if (f.geom === "point") {
          has = true;
          x0 = Math.min(x0, f.p.x);
          x1 = Math.max(x1, f.p.x);
          y0 = Math.min(y0, f.p.y);
          y1 = Math.max(y1, f.p.y);
        } else
          f.vs.forEach((vv) => {
            has = true;
            x0 = Math.min(x0, vv.x);
            x1 = Math.max(x1, vv.x);
            y0 = Math.min(y0, vv.y);
            y1 = Math.max(y1, vv.y);
          });
      });
      if (!has) {
        x0 = -0.5;
        x1 = 4.5;
        y0 = -0.5;
        y1 = 4.5;
      }
      x0 -= 0.7;
      x1 += 0.7;
      y0 -= 0.7;
      y1 += 0.7;
      addDef(
        [
          { x: x0, y: y0, z: zt },
          { x: x1, y: y0, z: zt },
          { x: x1, y: y1, z: zt },
          { x: x0, y: y1, z: zt },
        ],
        "#FFFFFF",
        "#E2E2E8",
        1,
        0.98 * g,
      );
      addDef(
        [
          { x: x0, y: y0, z: z0 },
          { x: x1, y: y0, z: z0 },
          { x: x1, y: y0, z: zt },
          { x: x0, y: y0, z: zt },
        ],
        "#E3E3EB",
        null,
        0,
        g,
      );
      addDef(
        [
          { x: x0, y: y1, z: z0 },
          { x: x1, y: y1, z: z0 },
          { x: x1, y: y1, z: zt },
          { x: x0, y: y1, z: zt },
        ],
        "#EDEDF3",
        null,
        0,
        g,
      );
      addDef(
        [
          { x: x0, y: y0, z: z0 },
          { x: x0, y: y1, z: z0 },
          { x: x0, y: y1, z: zt },
          { x: x0, y: y0, z: zt },
        ],
        "#E9E9F0",
        null,
        0,
        g,
      );
      addDef(
        [
          { x: x1, y: y0, z: z0 },
          { x: x1, y: y1, z: z0 },
          { x: x1, y: y1, z: zt },
          { x: x1, y: y0, z: zt },
        ],
        "#E0E0E8",
        null,
        0,
        g,
      );
      fl.features.forEach((f) => {
        const fg = fgOf(f.subtype),
          bg = bgOf(f.subtype);
        if (f.geom === "poly") {
          addDef(
            f.vs.map((q) => ({ x: q.x, y: q.y, z: zt + 0.02 })),
            bg,
            fg,
            1,
            0.72 * g,
          );
          const n = f.vs.length;
          for (let i = 0; i < n; i++) {
            const a = f.vs[i],
              b = f.vs[(i + 1) % n];
            addDef(
              [
                { x: a.x, y: a.y, z: zt },
                { x: b.x, y: b.y, z: zt },
                { x: b.x, y: b.y, z: zt + WALL },
                { x: a.x, y: a.y, z: zt + WALL },
              ],
              fg,
              null,
              0,
              0.32 * g,
            );
          }
        } else if (f.geom === "line") {
          for (let i = 0; i < f.vs.length - 1; i++) {
            const a = f.vs[i],
              b = f.vs[i + 1];
            const dx = b.x - a.x,
              dy = b.y - a.y,
              l = Math.hypot(dx, dy) || 1;
            const nx = ((-dy / l) * PATHW) / 2,
              ny = ((dx / l) * PATHW) / 2;
            addDef(
              [
                { x: a.x + nx, y: a.y + ny, z: zt + 0.02 },
                { x: a.x - nx, y: a.y - ny, z: zt + 0.02 },
                { x: b.x - nx, y: b.y - ny, z: zt + 0.02 },
                { x: b.x + nx, y: b.y + ny, z: zt + 0.02 },
              ],
              fg,
              null,
              0,
              0.9 * g,
            );

      });
    });

    const cs = [];
    [bnd.x0, bnd.x1].forEach((x) =>
      [bnd.y0, bnd.y1].forEach((y) =>
        [bnd.z0, bnd.z1].forEach((z) => cs.push(proj({ x: x, y: y, z: z }))),
      ),
    );
    const xs = cs.map((c) => c[0]),
      ys = cs.map((c) => c[1]);
    const mnx = Math.min.apply(null, xs),
      mxx = Math.max.apply(null, xs);
    const mny = Math.min.apply(null, ys),
      mxy = Math.max.apply(null, ys);
    const k =
      Math.min((W - 36) / Math.max(mxx - mnx, 1), (H - 36) / Math.max(mxy - mny, 1)) * v.zoom;
    pj = { k: k, cx: (W - (mnx + mxx) * k) / 2, cy: (H - (mny + mxy) * k) / 2 };

      .map((d) => {
        const P = d.pts.map(proj);
        const dpth = P.reduce((s, q) => s + q[2], 0) / P.length;
        return {
          d: dpth,
          s:
            '<polygon points="' +
            P.map((q) => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ") +
            '" fill="' +
            d.fill +
            '"' +
            (d.stroke
              ? ' stroke="' + d.stroke + '" stroke-width="' + d.sw + '" stroke-linejoin="round"'
              : "") +
            (d.op < 1 ? ' fill-opacity="' + d.op.toFixed(2) + '"' : "") +
            "/>",
        };
      })
      .sort((a, b) => b.d - a.d);
    // pins, junctions and labels drawn on top (annotations, not geometry)
    let tops = "";
    floors.forEach((fl) => {
      const z0 = (fl.order - floors[0].order) * GAP,
        zt = z0 + SLAB;
      const g = fl.id === active ? 1 : 0.25;
      fl.features.forEach((f) => {
        if (f.geom !== "point") return;
        const fg = fgOf(f.subtype);
        const b = proj({ x: f.p.x, y: f.p.y, z: zt }),
          tp = proj({ x: f.p.x, y: f.p.y, z: zt + 1.05 });
        tops +=
          '<line x1="' +
          b[0].toFixed(1) +
          '" y1="' +
          b[1].toFixed(1) +
          '" x2="' +
          tp[0].toFixed(1) +
          '" y2="' +
          tp[1].toFixed(1) +
          '" stroke="' +
          fg +
          '" stroke-width="2" opacity="' +
          g +
          '"/>';
        tops +=
          '<circle cx="' +
          tp[0].toFixed(1) +
          '" cy="' +
          tp[1].toFixed(1) +
          '" r="4.5" fill="' +
          fg +
          '" stroke="#fff" stroke-width="1.6" opacity="' +
          g +
          '"/>';
        if (f.name && g === 1) {
          tops +=
            '<text x="' +
            tp[0].toFixed(1) +
            '" y="' +
            (tp[1] - 8).toFixed(1) +
            '" text-anchor="middle" font-size="11" font-weight="600" font-family="Instrument Sans,sans-serif" fill="' +
            fg +
            '" stroke="#FBFBF9" stroke-width="3" paint-order="stroke">' +
            esc(f.name) +
            "</text>";
        }
      });
      if (g === 1) {
        junctionPoints(fl).forEach((j) => {
          const q = proj({ x: j.x, y: j.y, z: zt + 0.04 });
          tops +=
            '<circle cx="' +
            q[0].toFixed(1) +
            '" cy="' +
            q[1].toFixed(1) +
            '" r="3.2" fill="#4F46E5" stroke="#fff" stroke-width="1.4"/>';
        });
      }
    });
    host.innerHTML =
      '<svg width="100%" height="100%" viewBox="0 0 ' +
      W +
      " " +
      H +
      '" style="display:block;background:#FBFBF9;border-radius:2px">' +
      faces.map((f) => f.s).join("") +
      tops +
      "</svg>";

  function bindV3() {
    const host = document.getElementById("v3d");
    if (!host) return;
    let drag = null;
    host.onpointerdown = (e) => {
      host.setPointerCapture(e.pointerId);
      drag = { x: e.clientX, y: e.clientY };
      stopRot();
    };
    host.onpointermove = (e) => {
      if (!drag) return;
      S.v3.yaw += (e.clientX - drag.x) * 0.008;
      S.v3.pitch = clamp(S.v3.pitch - (e.clientY - drag.y) * 0.006, 0.05, 1.4);
      drag = { x: e.clientX, y: e.clientY };
      render3D();
    };
    host.onpointerup = () => {
      drag = null;
    };
    host.onpointercancel = () => {
      drag = null;
    };
    host.onwheel = (e) => {
      e.preventDefault();
      S.v3.zoom = clamp(S.v3.zoom * (e.deltaY < 0 ? 1.1 : 0.9), 0.45, 3);
      render3D();
    };
  }

    const n = NOTES[key] || NOTES.workspace;
    el.innerHTML =
      '<div class="eyebrow">Build notes</div><h3>' +
      n.t +
      "</h3><ul>" +
      n.items.map((i) => "<li>" + i + "</li>").join("") +
      "</ul>";
  }

  /* ================= actions ================= */
  function gid(id) {
    const el = document.getElementById(id);
    return el ? el.value : "";
  }
  const ACTIONS = {
    noop: () => {},
    "sheet-close": () => {
      S.sheet = null;
      S.edd = null;
      render();
    },
    "reset-demo": () => {
      S = freshState();
      V.init = false;
      render();
    },
    "new-project": () => {
      S.sheet = { kind: "new" };
      render();
    },
    "np-floor": (el, ctx) => {
      S.npFloor = ctx.s;
      el.closest(".chiprow")
        .querySelectorAll(".choice")
        .forEach((c) => c.classList.toggle("on", c === el));
      const ci = document.getElementById("np-custom");
      if (ci) ci.hidden = ctx.s !== "Custom";
      if (ci && ctx.s === "Custom") ci.focus();
    },
    "create-project": () => {
      const name = gid("np-name").trim();
      if (!name) {
        const e = document.getElementById("np-err");
        if (e) e.hidden = false;
        return;
      }
      const sf = S.npFloor === "Custom" ? gid("np-custom").trim() || "Ground" : S.npFloor;
      const p = {
        id: uid(),
        name: name,
        address: gid("np-addr").trim(),
        created: "2026-09-28",
        edited: "just now",
        backupAt: null,
        floors: [{ id: uid(), name: sf, order: 0, status: "mapping", scale: null, features: [] }],
      };
      S.projects.unshift(p);
      S.pid = p.id;
      S.fid = p.floors[0].id;
      S.sheet = null;
      S.screen = "project";
      toast("Project created");
      render();
    },
    "open-project": (el, ctx) => {
      S.pid = ctx.id;
      S.screen = "project";
      S.sheet = null;
      render();
    },
    "back-dash": () => {
      S.screen = "dashboard";
      S.pid = null;
      S.sheet = null;
      render();
    },
    "proj-menu": () => {
      S.sheet = { kind: "menu" };
      render();
    },
    "rename-open": () => {
      S.sheet = { kind: "rename" };
      render();
    },
    "rename-save": () => {
      const v = gid("rn-name").trim();
      if (v && curProj()) {
        curProj().name = v;
        toast("Renamed");
      }
      S.sheet = null;
      render();
    },
    "proj-delete-open": () => {
      S.sheet = { kind: "confirm-project" };
      render();
    },
    "proj-delete-yes": () => {
      S.projects = S.projects.filter((x) => x.id !== S.pid);
      S.pid = null;
      S.sheet = null;
      S.screen = "dashboard";
      toast("Project deleted");
      render();
    },
    "backup-demo": () => {
      const p = curProj() || S.projects[0];
      if (p) p.backupAt = "just now";
      S.sheet = null;
      S.backupDismissed = true;
      toast("Backup downloaded (stub in prototype)");
      render();
    },
    "dismiss-backup": () => {
      S.backupDismissed = true;
      render();
    },
    "import-backup": () => {
      toast("Prototype: opens a .walkandplot.json picker and imports a copy");
    },
    "add-floor": () => {
      S.sheet = { kind: "floor" };
      render();
    },
    "fl-chip": (el, ctx) => {
      const i = document.getElementById("fl-name");
      if (i) i.value = ctx.s;
    },
    "create-floor": () => {
      const p = curProj();
      if (!p) return;
      const n = p.floors.length + 1;
      const name = gid("fl-name").trim() || "Floor " + n;
      const order = Math.max.apply(null, p.floors.map((x) => x.order).concat([-1])) + 1;
      p.floors.push({
        id: uid(),
        name: name,
        order: order,
        status: "mapping",
        scale: null,
        features: [],
      });
      p.edited = "just now";
      S.sheet = null;
      toast("Floor added");
      render();
    },
    "open-floor": (el, ctx) => {
      toMap(ctx.id);
      render();
    },
    "back-proj": () => {
      S.screen = "project";
      S.flow = null;
      S.sel = null;
      S.sheet = null;
      S.edd = null;
      render();
    },
    "trace-path": () => {
      S.flow = { tool: "path", subtype: "corridor", stage: "plot", vs: [] };
      S.sel = null;
      render();
    },
    palette: () => {
      S.sheet = { kind: "palette" };
      render();
    },
    "pick-type": (el, ctx) => {
      const T = TYPES[ctx.t];
      S.sheet = null;
      S.sel = null;
      S.flow =
        T.geom === "point"
          ? { tool: "place", subtype: ctx.t, stage: "place", vs: [] }
          : { tool: "place", subtype: ctx.t, stage: "plot", vs: [] };
      render();
    },
    "plot-undo": () => {
      const fl = S.flow;
      if (!fl) return;
      if (fl.vs.length) {
        fl.vs.pop();
        paintMap();
      } else {
        S.flow = null;
        render();
      }
    },
    "plot-cancel": () => {
      const fl = S.flow;
      if (!fl) return;
      if (fl.vs.length) {
        S.sheet = { kind: "discard" };
        render();
      } else {
        S.flow = null;
        render();
      }
    },
    "discard-keep": () => {
      S.sheet = null;
      render();
    },
    "discard-yes": () => {
      S.flow = null;
      S.sheet = null;
      render();
    },
    "toggle-rag": () => {
      S.rag = !S.rag;
      render();
    },
    "plot-done": () => {
      finishGesture();
    },
    "hist-undo": () => {
      histGo(-1);
    },
    "hist-redo": () => {
      histGo(1);
    },
    "edit-details": () => {
      const f = curFloor().features.find((x) => x.id === S.sel);
      if (!f) return;
      S.edd = draftOf(f);
      S.sheet = { kind: f.cat === "path" ? "detail-path" : "detail", fid: f.id };
      render();
    },
    "sel-delete": () => {
      deleteSel();
    },
    dchip: (el, ctx) => {
      const v = ctx.d,
        i = v.indexOf(":");
      const fld = v.slice(0, i),
        val = v.slice(i + 1);
      if (fld === "connect") {
        if (S.edd) S.edd.connect = null;
        const f = curFloor().features.find((x) => x.id === S.sheet.fid);
        if (f && f.props) delete f.props.connect;
        render();
        return;
      }
      if (!S.edd) return;
      S.edd[fld] = val;
      if (fld === "toFloorId") {
        render();
        return;
      }
      const row = el.closest(".chiprow");
      if (row) row.querySelectorAll(".choice").forEach((c) => c.classList.toggle("on", c === el));
    },
    "detail-skip": () => {
      S.sheet = null;
      S.edd = null;
      render();
    },
    "detail-save": () => {
      const floor = curFloor();
      const f = floor.features.find((x) => x.id === S.sheet.fid);
      if (!f || !S.edd) return;
      const d = S.edd;
      if (S.sheet.kind === "detail-path") {
        f.subtype = d.tag;
        f.geom = TYPES[d.tag].geom;
        f.notes = gid("dt-notes").trim() || null;
        f.props.width = gid("dt-width").trim() || null;
      } else {
        f.name = gid("dt-name").trim() || null;
        f.access = d.access;
        f.confidence = d.conf;
        f.notes = gid("dt-notes").trim() || null;
        const pr = f.props || (f.props = {});
        if (f.subtype === "shop") pr.shopNumber = gid("dt-number").trim() || null;
        if (f.subtype === "toilet" && d.gender) pr.gender = d.gender;
        if (f.subtype === "entrance" && d.kind) pr.kind = d.kind;
        if (isConn(f.subtype)) {
          if (d.direction) pr.direction = d.direction;
          if (f.subtype === "lift" && d.kind) pr.kind = d.kind;
          if (f.subtype === "stair") pr.accessible = d.accessible || null;
          let tid = d.toFloorId || null;
          if (tid === "new") {
            const nname = gid("dt-newfloor").trim() || "Floor " + (curProj().floors.length + 1);
            const order =
              Math.max.apply(
                null,
                curProj().floors.map((x) => x.order),
              ) + 1;
            const nf = {
              id: uid(),
              name: nname,
              order: order,
              status: "mapping",
              scale: null,
              features: [],
            };
            nf.features.push({
              id: uid(),
              subtype: f.subtype,
              cat: "place",
              geom: "point",
              name: null,
              access: "public",
              status: "active",
              confidence: "high",
              notes: null,
              props: { direction: d.direction || null, toFloorId: floor.id },
              connectorGroupId: f.connectorGroupId || "cg" + uid(),
              p: { x: f.p.x, y: f.p.y },
            });
            curProj().floors.push(nf);
            tid = nf.id;
            toast(nname + " created with this connector");
          }
          pr.toFloorId = tid;
        }
      }
      curProj().edited = "just now";
      pushHist();
      savedPulse();
      S.sheet = null;
      S.edd = null;
      toast("Details saved");
      render();
    },
    "photo-stub": () => {
      toast("Prototype: opens the camera through a file input");
    },
    calibrate: () => {
      S.calSel = null;
      S.sheet = { kind: "calibrate" };
      render();
    },
    "cal-sel": (el, ctx) => {
      S.calSel = ctx.id;
      render();
    },
    "step-plus": () => {
      S.calSteps = (S.calSteps || 0) + 1;
      const c = document.getElementById("cal-cnt"),
        q = document.getElementById("cal-eq");
      if (c) c.textContent = S.calSteps;
      if (q) q.textContent = "= " + (S.calSteps * 0.75).toFixed(1) + " m at 0.75 m per step";
    },
    "cal-use-steps": () => {
      if (!S.calSteps) {
        toast("Tap + 1 step for each step you walk");
        return;
      }
      const i = document.getElementById("cal-len");
      if (i) i.value = (S.calSteps * 0.75).toFixed(2);
    },
    "cal-apply": () => {
      const floor = curFloor();
      const sel = floor.features.find((f) => f.id === S.calSel);
      let real = parseFloat(gid("cal-len"));
      if ((!real || real <= 0) && S.calSteps) real = S.calSteps * 0.75;
      if (!sel) {
        toast("Trace a path first");
        return;
      }
      if (!real || real <= 0) {
        toast("Enter the real length first");
        return;
      }
      const units = pathLen(sel.vs);
      if (units <= 0) {
        toast("That line has no length yet");
        return;
      }
      const mult = real / units;
      floor.features.forEach((f) => {
        if (f.geom === "point") f.p = { x: f.p.x * mult, y: f.p.y * mult };
        else f.vs = f.vs.map((v) => ({ x: v.x * mult, y: v.y * mult }));
      });
      floor.scale = { calibrated: true, metersPerUnit: 1 };
      V.init = false;
      pushHist();
      savedPulse();
      S.sheet = null;
      toast("Floor rescaled - lengths now show meters");
      render();
    },
    "dismiss-hint": () => {
      S.calHintDismissed = true;
      render();
    },
    "finish-sheet": () => {
      S.sheet = { kind: "finish" };
      render();
    },
    "finish-floor": () => {
      const floor = curFloor();
      floor.status = "completed";
      curProj().edited = "just now";
      S.sheet = null;
      S.screen = "floordone";
      toast(floor.name + " completed");
      render();
    },
    "export-open": () => {
      S.sheet = { kind: "export" };
      render();
    },
    "export-preview": () => {
      const pre = document.getElementById("geopre"),
        l = document.getElementById("epl");
      if (pre) {
        pre.hidden = !pre.hidden;
        if (l) l.textContent = pre.hidden ? "Preview GeoJSON" : "Hide preview";
      }
    },
    "export-preview-d": () => {
      const pre = document.getElementById("dgeopre");
      if (pre) pre.hidden = !pre.hidden;
    },
    "copy-geo": () => {
      if (!navigator.clipboard) {
        toast("Copy unavailable - select the text instead");
        return;
      }
      navigator.clipboard.writeText(S._geo || "").then(
        () => toast("GeoJSON copied"),
        () => toast("Copy blocked - select the text instead"),
      );
    },
    "dl-row": () => {
      toast("Prototype: the real app saves this file to your device");
    },
    "install-demo": () => {
      toast("Prototype: this opens the PWA install prompt");
    },
    "install-close": () => {
      S.installHidden = true;
      render();
    },
    "zoom-in": () => {
      const r = document.getElementById("mapwrap").getBoundingClientRect();
      zoomAt(r.width / 2, r.height / 2, 1.3);
    },
    "zoom-out": () => {
      const r = document.getElementById("mapwrap").getBoundingClientRect();
      zoomAt(r.width / 2, r.height / 2, 0.77);
    },
    fit: () => {
      fitMap();
    },
    "toggle-3d": () => {
      S.v3.on = !S.v3.on;
      if (!S.v3.on) stopRot();
      render();
    },
    "v3-focus": (el, ctx) => {
      S.v3.focus = ctx.s;
      render();
    },
    "v3-reset": () => {
      S.v3.yaw = V3DEF.yaw;
      S.v3.pitch = V3DEF.pitch;
      S.v3.zoom = 1;
      render3D();
      bindV3();
    },
    "v3-top": () => {
      S.v3.pitch = 0.05;
      render3D();
    },
    "desk-2d": () => {
      S.desk3 = false;
      stopRot();
      render();
    },
    "desk-3d": () => {
      S.desk3 = true;
      render();
    },
  };
  document.addEventListener("click", (e) => {
    const n = e.target.closest("[data-nav]");
    if (n) {
      navTo(n.getAttribute("data-nav"));
      return;
    }
    const el = e.target.closest("[data-a]");
    if (!el) return;
    const a = el.getAttribute("data-a");
    if (ACTIONS[a])
      ACTIONS[a](el, {
        id: el.getAttribute("data-id"),
        s: el.getAttribute("data-s"),
        d: el.getAttribute("data-d"),
        t: el.getAttribute("data-t"),
      });
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "cf-input") {
      const b = document.getElementById("cf-yes");
      if (b) b.disabled = e.target.value !== "DELETE";
    }
  });

  /* ================= init ================= */
  S = freshState();
  render();
  window.addEventListener("resize", () => {
    if (S.screen === "map" && document.getElementById("mapg")) paintMap();
    if (document.getElementById("v3d")) render3D();
  });
</script>
